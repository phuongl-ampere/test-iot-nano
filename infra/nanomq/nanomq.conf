mqtt {
    max_packet_size = 2MB
    max_mqueue_len = 16384
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

listeners.tcp {
    # Device-facing MQTT terminates in iot-mqtt-transport on public TLS :8883.
    # NanoMQ must stay private: it cannot virtualize v1/devices/me RPC topics
    # by authenticated MQTT session.
    bind = "127.0.0.1:1883"
}

http_server {
    # Keep NanoMQ management separate from iot-ingest's private webhook
    # listener at 127.0.0.1:8081.
    port = 8082
    limit_conn = 32
    username = admin
    password = change-before-deploying
    auth_type = basic
}

sqlite {
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/"
    flush_mem_threshold = 100
    resend_interval = 5000
}

log {
    to = [console]
    level = warn
}

auth {
    # NanoMQ 0.25.6 evaluates http_auth only after legacy auth permits CONNECT.
    # The HTTP endpoint below remains the device authentication gate.
    allow_anonymous = true
    no_match = deny
    deny_action = disconnect

    http_auth {
        auth_req {
            url = "http://127.0.0.1:8080/internal/nanomq/auth"
            method = post
            headers.content-type = "application/x-www-form-urlencoded"
            headers.x-iot-nanomq-auth = "replace-with-IOT_NANOMQ_AUTH_SECRET"
            params = {clientid = "%c", username = "%u", password = "%P"}
        }

        acl_req {
            url = "http://127.0.0.1:8080/internal/nanomq/acl"
            method = post
            headers.content-type = "application/x-www-form-urlencoded"
            headers.x-iot-nanomq-auth = "replace-with-IOT_NANOMQ_AUTH_SECRET"
            params = {clientid = "%c", username = "%u", access = "%A", ipaddr = "%a", topic = "%t", mountpoint = "%m"}
        }

        timeout = 2s
        connect_timeout = 2s
        pool_size = 32
        cache_ttl = 0s
    }
}

webhook {
    enable = true
    url = "http://127.0.0.1:8081/internal/nanomq/telemetry"
    headers.content-type = "application/json"
    headers.x-iot-nanomq-webhook = "replace-with-IOT_NANOMQ_WEBHOOK_SECRET"
    body.encoding = plain
    cancel_timeout = 2000
    pool_size = 32
    events = [
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/devices/me/telemetry"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/connect"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/disconnect"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/telemetry"
        }
    ]
}
