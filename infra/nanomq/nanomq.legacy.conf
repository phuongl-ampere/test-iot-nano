mqtt {
    max_packet_size = 2MB
    max_mqueue_len = 16384
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

sqlite {
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/"
    flush_mem_threshold = 100
    resend_interval = 5000
}

log {
    to = [console]
    level = warn
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}
