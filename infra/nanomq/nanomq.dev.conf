mqtt {
    max_packet_size = 2MB
    max_mqueue_len = 16384
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

listeners.tcp {
    # Docker publishes this listener to the host for local broker/legacy tests.
    # Production nanomq.conf remains loopback-only because Rust transport owns
    # public device MQTT on TLS :8883.
    bind = "0.0.0.0:1883"
}

sqlite {
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/"
    flush_mem_threshold = 100
    resend_interval = 5000
}

log {
    to = [console]
    level = warn
}

auth {
    # NanoMQ 0.25.6 requires this legacy switch for HTTP auth with an empty
    # MQTT password. `no_match = deny` plus http_auth is the actual gate.
    allow_anonymous = true
    no_match = deny
    deny_action = disconnect

    http_auth {
        auth_req {
            url = "http://host.docker.internal:8080/internal/nanomq/auth"
            method = post
            headers.content-type = "application/x-www-form-urlencoded"
            headers.x-iot-nanomq-auth = "development-nanomq-auth-secret-32-bytes"
            params = {clientid = "%c", username = "%u", password = "%P"}
        }

        acl_req {
            url = "http://host.docker.internal:8080/internal/nanomq/acl"
            method = post
            headers.content-type = "application/x-www-form-urlencoded"
            headers.x-iot-nanomq-auth = "development-nanomq-auth-secret-32-bytes"
            params = {clientid = "%c", username = "%u", access = "%A", ipaddr = "%a", topic = "%t", mountpoint = "%m"}
        }

        timeout = 2s
        connect_timeout = 2s
        pool_size = 32
        cache_ttl = 0s
    }
}

webhook {
    enable = true
    url = "http://host.docker.internal:18081/internal/nanomq/telemetry"
    headers.content-type = "application/json"
    headers.x-iot-nanomq-webhook = "development-nanomq-webhook-secret-32-bytes"
    body.encoding = plain
    cancel_timeout = 2000
    pool_size = 32
    events = [
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/devices/me/telemetry"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/connect"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/disconnect"
        },
        {
            event = "on_message_publish"
            action = "post"
            topic = "v1/gateways/me/telemetry"
        }
    ]
}
