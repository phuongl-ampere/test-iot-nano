services:
  iot-nano-monolith:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    environment:
      IOT_NANO_STORAGE: sqlite
      IOT_NANO_SQLITE_PATH: /var/lib/iot-nano/platform/platform.sqlite
      IOT_NANO_INTERNAL_DIR: /var/lib/iot-nano/internal
      IOT_NANO_TLS_CERT_PATH: /run/tls/mqtt-cert.pem
      IOT_NANO_TLS_KEY_PATH: /run/tls/mqtt-key.pem
      IOT_NANO_HTTP_ADDRESS: 0.0.0.0:18080
      IOT_NANO_MQTT_TCP_ADDRESS: 0.0.0.0:1883
      IOT_NANO_MQTT_TLS_ADDRESS: 0.0.0.0:8883
      IOT_DEVICE_TOKEN_VAULT_KEY: ${IOT_DEVICE_TOKEN_VAULT_KEY:?IOT_DEVICE_TOKEN_VAULT_KEY is required}
    ports:
      - "18080:18080"
      - "1883:1883"
      - "8883:8883"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:18080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - platform-data:/var/lib/iot-nano/platform
      - internal-data:/var/lib/iot-nano/internal
      - ./tls:/run/tls:ro

volumes:
  platform-data:
  internal-data:
