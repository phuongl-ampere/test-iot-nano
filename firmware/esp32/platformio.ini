[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = false

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DPROVISIONING_PASSWORD=\"replace-before-flashing\"
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
