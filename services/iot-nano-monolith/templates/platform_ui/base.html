<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IoT Nano{% endblock %}</title>
    <link rel="stylesheet" href="/assets/platform-ui.css">
    <script src="/assets/htmx.min.js"></script>
    <script>
      (() => {
        const refreshSelector = "[data-pause-when-hidden]";

        document.addEventListener("htmx:beforeRequest", (event) => {
          const target = event.target;
          if (
            document.hidden &&
            target instanceof Element &&
            target.matches(refreshSelector)
          ) {
            event.preventDefault();
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && window.htmx) {
            document.querySelectorAll(refreshSelector).forEach((element) => {
              window.htmx.trigger(element, "visibilityrefresh");
            });
          }
        });
      })();
    </script>
  </head>
  <body>
    <div class="console-shell">
      <header class="topbar">
        <div class="brand" aria-label="IoT Nano">
          <span class="brand-mark">IN</span>
          <span>
            <strong>IoT Nano</strong>
            <small>{% block account_kind %}{% endblock %}</small>
          </span>
        </div>
        <div class="topbar-actions">
          <div class="account-label">{{ identity.label }}</div>
          {% block account_actions %}
            <form class="logout-form" action="/logout" method="post">
              <button class="logout-button" type="submit">Sign out</button>
            </form>
          {% endblock %}
        </div>
      </header>
      <div class="console-body">
        <aside class="sidebar">
          <nav class="side-nav" aria-label="{% block navigation_label %}Platform{% endblock %}">
            {% block navigation %}{% endblock %}
          </nav>
        </aside>
        <main class="content">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
