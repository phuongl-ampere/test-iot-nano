version = 1

[broker]
max_connections = 10000
max_payload_size = 2097152
max_inflight_count = 100

[listeners.tcp]
address = "127.0.0.1:1883"

[listeners.tls]
address = "0.0.0.0:8883"
certificate_path = "/etc/rush-iot-nano/tls/mqtt-cert.pem"
key_path = "/etc/rush-iot-nano/tls/mqtt-key.pem"

[storage]
kind = "sqlite"
path = "/var/lib/iot-nano-mqttd/broker.sqlite"
prune_interval_ms = 60000

[management]
address = "127.0.0.1:8082"
username = "admin"
password = "replace-before-deploying"

[device_transport]
enabled = false

[static_acl]
enabled = true
deny_action = "disconnect"

[[static_acl.users]]
username = "device-operator"
password = "replace-before-deploying"

[[static_acl.rules]]
identity = "device-operator"
topic = "sensors/+/telemetry"
publish = true
subscribe = true
